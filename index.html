<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff3de">
  <meta name="description" content="依教育部英語文課綱附錄五建立的會考單字每日複習工具">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>單字日課｜會考 2000 字</title>
</head>
<body>
<button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-symbol">Aa</div><div><strong>單字日課</strong><span>每天記得住，一路到會考</span></div></div>
    <div class="top-actions"><span id="connect-tag" class="connection-pill">本機試用</span><button id="account-shortcut" class="text-button" data-view="account">帳號設定</button></div>
  </header>
  <div class="layout">
    <nav class="side-nav" aria-label="主選單">
      <button class="nav-btn active" data-view="home">☀️ <span>今日任務</span></button>
      <button class="nav-btn" data-view="calendar">🗓️ <span>學習月曆</span></button>
      <button class="nav-btn" data-view="library">📚 <span>字庫總覽</span></button>
      <button class="nav-btn" data-view="account">👤 <span>帳號設定</span></button>
      <button class="nav-btn" id="teacher-nav" data-view="teacher" hidden>🧑‍🏫 <span>導師查核</span></button>
      <div class="nav-footer">依教育部 108 課綱英語文附錄五整理<br>會考：2027 / 05 / 15–16</div>
    </nav>
    <main id="view-root" aria-live="polite">
      <div class="loading">正在載入單字與學習紀錄…</div>
    </main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script src="config.js"></script>
<script src="word-data-full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="app.js" defer></script>
</body>
</html>
