<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9f4ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="單字日課">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="description" content="依教育部英語文課綱附錄五建立的會考單字每日複習工具">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>單字日課｜會考 2000 字</title>
</head>
<body>
<button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-symbol">Aa</div><div><strong>單字日課</strong><span>每天記得住，一路到會考</span></div></div>
    <div class="top-actions"><span id="connect-tag" class="connection-pill">本機記錄</span><button id="install-shortcut" type="button" class="install-link" aria-label="加入手機主畫面">⊕ 安裝</button><button id="account-shortcut" class="text-button" data-view="account">帳號設定</button></div>
  </header>
  <div class="layout">
    <nav class="side-nav" aria-label="主選單">
      <button class="nav-btn active" data-view="home">☀️ <span>今日任務</span></button>
      <button class="nav-btn" data-view="calendar">🗓️ <span>學習月曆</span></button>
      <button class="nav-btn" data-view="library">📚 <span>字庫總覽</span></button>
      <button class="nav-btn nav-account" data-view="account">👤 <span>帳號設定</span></button>
      <div class="nav-group-title">自主練習</div>
      <button class="nav-btn nav-practice nav-c2e" data-practice="c2e" aria-label="中翻英自主練習">✍️ <span>中翻英</span></button>
      <button class="nav-btn nav-practice nav-cloze" data-practice="cloze" aria-label="克漏字自主練習">📖 <span>克漏字</span></button>
      <div class="nav-footer">依教育部 108 課綱英語文附錄五整理<br>會考：2027 / 05 / 15–16</div>
    </nav>
    <main id="view-root" aria-live="polite">
      <div class="loading">正在載入單字與學習紀錄…</div>
    </main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script src="config.js"></script>
<script src="word-data-full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="app.js" defer></script>
</body>
</html>
